<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式分析ツール</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header>
  <button type="button" id="menu-btn" aria-label="メニューを開く" aria-expanded="false" aria-controls="app-nav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span id="cur-tab"></span>
  <nav id="app-nav">
    <button data-tab="earnings" class="active">決算速報</button>
    <button data-tab="chart">チャート</button>
    <button data-tab="stock">銘柄</button>
    <button data-tab="screener">スクリーナー</button>
    <button data-tab="pts">PTS</button>
    <button data-tab="monthly">月次</button>
    <button data-tab="supply">サプライ</button>
  </nav>
</header>
<div id="nav-backdrop" hidden></div>
<main>

<section id="tab-earnings">
  <div class="egrid">

    <div class="panel a-list">
      <div class="phead">
        <h3 id="earn-title">日付を選択してください</h3>
        <div class="phead-right">
          <span class="sub" id="earn-count" style="font-size:12px"></span>
          <div class="cal-wrap" id="cal-wrap">
            <button type="button" class="cal-btn" id="cal-btn" aria-label="決算カレンダーを開く" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal-pop">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"/>
                <path d="M8 3v4M16 3v4M3 10h18"/>
              </svg>
            </button>
            <div class="cal-pop" id="cal-pop" hidden role="dialog" aria-label="決算カレンダー">
              <div class="row">
                <button type="button" class="btn" onclick="calMove(-1)">◀</button>
                <b id="cal-title"></b>
                <button type="button" class="btn" onclick="calMove(1)">▶</button>
              </div>
              <div class="cal" id="cal"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row" style="position:relative;margin:0 0 8px">
        <input id="earn-sym" placeholder="銘柄名 or コード" autocomplete="off" style="width:200px">
        <div id="earn-suggest" class="suggest" style="display:none"></div>
      </div>
      <div id="earn-groups"></div>
      <div class="earn-box">
        <div class="phead">
          <div class="fin-tabs" id="earn-view">
            <button type="button" class="ftab on" data-view="cum">累計</button>
            <button type="button" class="ftab" data-view="q">3か月</button>
            <button type="button" class="ftab" data-view="prog">進捗率</button>
          </div>
          <span class="sub" style="font-size:12px">単位: 百万円</span>
        </div>
        <div id="earn-qf">
          <label><input type="checkbox" value="1Q" checked>1Q</label>
          <label><input type="checkbox" value="2Q" checked>2Q</label>
          <label><input type="checkbox" value="3Q" checked>3Q</label>
          <label><input type="checkbox" value="4Q" checked>4Q</label>
        </div>
        <div class="tbl-wrap scroll" id="earn-list" tabindex="0"></div>
      </div>
    </div>

    <div class="panel a-fin">
      <div class="phead">
        <div class="fin-tabs">
          <button type="button" class="ftab on" data-fin="cum">累計</button>
          <button type="button" class="ftab" data-fin="q">3か月</button>
          <button type="button" class="ftab" data-fin="prog">進捗率</button>
          <button type="button" class="ftab" data-fin="rev">修正履歴</button>
        </div>
        <span class="sub" style="font-size:12px">単位: 百万円</span>
      </div>
      <div class="tbl-wrap" id="cum-wrap"><table class="fin" id="cum-tbl"></table></div>
      <div class="tbl-wrap" id="q-wrap" hidden><table class="fin" id="q-tbl"></table></div>
      <div class="tbl-wrap" id="prog-wrap" hidden><table class="fin" id="prog-tbl"></table></div>
      <div class="tbl-wrap" id="rev-wrap" hidden><table class="fin" id="rev-tbl"></table></div>
    </div>

    <div class="panel a-chart">
      <div class="phead"><h3 id="e-chart-title">銘柄を選択してください</h3></div>
      <div id="e-chart" style="height:320px"></div>
      <div class="evt-toggles"></div>
    </div>

  </div>
</section>

<section id="tab-chart" style="display:none">
  <div class="panel">
    <div class="row" style="position:relative">
      <input id="sym" placeholder="銘柄名 or コード" autocomplete="off" style="width:200px">
      <div id="suggest" class="suggest" style="display:none"></div>
      <select id="tf"><option value="D">日足</option><option value="W">週足</option><option value="M">月足</option></select>
      <input id="mas" value="50,150,200" style="width:110px" title="移動平均(カンマ区切り)">
      <label><input type="checkbox" id="rel"> 対TOPIX</label>
      <button class="btn" onclick="loadChart()">表示</button>
    </div>
    <div id="chart-title"></div>
    <div id="chart" style="height:420px"></div>
    <div class="evt-toggles"></div>
    <div id="relwrap" style="display:none"><h3>対TOPIX相対 (期首=100)</h3><div id="relchart" style="height:160px"></div></div>
  </div>
  <div class="panel">
    <h3>決算発表後パフォーマンス (%, α=対TOPIX超過)</h3>
    <div class="tbl-wrap"><table id="perf-tbl"></table></div>
  </div>
</section>

<section id="tab-stock" style="display:none">
  <div class="panel">
    <div class="row" id="st-search" style="position:relative">
      <input id="st-sym" placeholder="銘柄名 or コード" autocomplete="off" style="width:200px">
      <div id="st-suggest" class="suggest" style="display:none"></div>
      <select id="st-filing" hidden aria-label="決算短信"></select>
      <div class="fin-tabs" id="st-zoom" role="group" aria-label="原文の大きさ">
        <button type="button" class="ftab on" data-zoom="fit">幅に合わせる</button>
        <button type="button" class="ftab" data-zoom="mid">中</button>
        <button type="button" class="ftab" data-zoom="actual">原寸</button>
      </div>
    </div>
    <div id="st-title"></div>
    <p id="st-src" class="sub" hidden></p>
    <div id="st-doc"></div>
  </div>
</section>

<section id="tab-screener" style="display:none">
  <div class="panel">
    <div class="row">
      ステージ:
      <select id="sc-stage">
        <option value="">全て</option><option value="2" selected>Stage 2 (上昇)</option>
        <option value="1">Stage 1 (底固め)</option><option value="3">Stage 3 (天井圏)</option>
        <option value="4">Stage 4 (下降)</option>
      </select>
      RS≧ <input id="sc-rs" type="number" value="70" style="width:70px">
      <button class="btn" onclick="loadScreener()">検索</button>
      <span id="sc-date" style="color:var(--sub)"></span>
    </div>
    <div class="tbl-wrap"><table id="sc-tbl"></table></div>
  </div>
</section>

<section id="tab-pts" style="display:none">
  <div class="panel">
    <div class="row">
      <select id="pts-date" aria-label="セッション日"></select>
      <div class="fin-tabs" id="pts-ranking" role="group" aria-label="ランキング">
        <button type="button" class="ftab on" data-ranking="night_up">値上がり</button>
        <button type="button" class="ftab" data-ranking="night_down">値下がり</button>
        <button type="button" class="ftab" data-ranking="night_volume">出来高</button>
      </div>
      <select id="pts-at" aria-label="取得時刻"></select>
      <span id="pts-info" class="sub"></span>
    </div>
    <div id="pts-summary" class="sub"></div>
    <div class="tbl-wrap"><table id="pts-tbl"></table></div>
  </div>
</section>

<section id="tab-monthly" style="display:none">
  <div id="monthly-top">
    <div class="phead"><h3>月次データ</h3></div>
    <div class="row" style="position:relative;margin:0 0 10px">
      <input id="monthly-sym" placeholder="銘柄名 or コード" autocomplete="off" style="width:200px">
      <div id="monthly-suggest" class="suggest" style="display:none"></div>
    </div>
    <div id="monthly-groups"></div>
    <div class="tbl-wrap" id="monthly-list"></div>
  </div>
  <div id="monthly-detail" style="display:none">
      <div class="phead">
        <button type="button" id="monthly-back">戻る</button>
        <h3 id="monthly-title"></h3>
      </div>
      <select id="monthly-series" onchange="setMonthlySeries(this.value)"></select>
      <div id="monthly-chart"></div>
      <div class="tbl-wrap" id="monthly-table-wrap"></div>
  </div>
</section>

<section id="tab-supply" style="display:none">
  <div class="row" id="supply-controls">
    <input type="search" id="supply-q" list="supply-names" placeholder="素材名・社名・証券コード" aria-label="素材・企業の検索" autocomplete="off">
    <datalist id="supply-names"></datalist>
    <button type="button" id="supply-reset" class="supply-btn">全体表示</button>
    <label class="sub supply-tg"><input type="checkbox" id="supply-merge" checked>線をまとめる</label>
    <span class="supply-legend sub"><span><i class="k-raw"></i>原料</span><span><i class="k-mid"></i>中間財</span><span><i class="k-prod"></i>最終製品</span><span><i class="k-recycled"></i>リサイクル資源</span><span><i class="k-ret"></i>使い終わると回収</span></span>
  </div>
  <div class="supply-grid">
    <div id="supply-map"><span id="supply-msg" class="sub">読み込み中…</span></div>
    <aside id="supply-panel"><div id="supply-grip" role="button" aria-label="詳細を広げる・縮める"></div><div id="supply-body"></div></aside>
  </div>
</section>

</main>
<div id="cal-backdrop" hidden></div>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/tabs.js"></script>
<script src="/static/js/chart-shared.js"></script>
<script src="/static/js/earnings.js"></script>
<script src="/static/js/chart-tab.js"></script>
<script src="/static/js/stock.js"></script>
<script src="/static/js/screener.js"></script>
<script src="/static/js/pts.js"></script>
<script src="/static/js/monthly.js"></script>
<script src="/static/js/supply.js"></script>
<script src="/static/js/boot.js"></script>
</body>
</html>

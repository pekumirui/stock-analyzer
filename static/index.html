<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式分析ツール</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#f3f5f7; --panel:#ffffff; --border:#d8dee6; --text:#222; --sub:#66707a;
          --accent:#0077b6; --up:#d32f2f; --down:#1b8a5a; --warn:#e6a100;
          --row:#f6f8fa; --row-sel:#e7f3fb; --now:#fff8e1; --grid:#e8ecf0; }
  * { box-sizing:border-box; margin:0; }
  html { color-scheme: light; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif; font-size:14px; }
  header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:3px solid var(--accent);
           border-bottom:1px solid var(--border); flex-wrap:wrap; background:var(--panel); }
  header h1 { font-size:16px; margin-right:8px; }
  nav button { background:none; border:none; color:var(--sub); padding:8px 10px; cursor:pointer; font-size:14px; border-bottom:2px solid transparent; }
  nav button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  main { padding:12px; max-width:1200px; margin:0 auto; }
  main.wide { max-width:1600px; }   /* 決算速報タブは2カラム密度を取るため広くする */
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:6px 8px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--sub); font-weight:normal; position:sticky; top:0; background:var(--panel); }
  td:first-child, th:first-child, td.l, th.l { text-align:left; }
  .pos { color:var(--up); } .neg { color:var(--down); }
  .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; margin-left:4px; }
  .badge.up { background:var(--up); color:#fff; }
  .badge.dn { background:var(--down); color:#fff; }
  .badge.rev { background:var(--warn); color:#fff; }
  .badge.st1 { background:#5b6470; } .badge.st2 { background:#2e8b57; }
  .badge.st3 { background:#b8860b; } .badge.st4 { background:#a04050; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal .h { text-align:center; color:var(--sub); font-size:12px; padding:4px; }
  .cal .d { min-height:52px; border:1px solid var(--border); border-radius:6px; padding:4px; cursor:pointer; }
  .cal .d:hover { border-color:var(--accent); }
  .cal .d.sel { border-color:var(--accent); background:var(--row-sel); }
  .cal .d .n { font-size:12px; color:var(--sub); }
  .cal .d .cnt { font-size:12px; color:var(--accent); margin-top:4px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  input,select { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:14px; }
  button.btn { background:var(--accent); border:none; color:#fff; border-radius:6px; padding:6px 12px; cursor:pointer; }
  #chart, #relchart { width:100%; }
  .evt-toggles { display:flex; gap:14px; flex-wrap:wrap; align-items:center;
                 margin-top:8px; padding-top:8px; border-top:1px solid var(--border);
                 font-size:13px; color:var(--sub); }
  .evt-toggles .evt-cap { font-size:12px; }
  .evt-toggles .evt-label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .evt-toggles .swatch { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .tbl-wrap { overflow-x:auto; }
  .clicky { cursor:pointer; color:var(--accent); }
  h3 { font-size:14px; color:var(--sub); margin:8px 0; }
  .suggest { position:absolute; background:var(--panel); border:1px solid var(--border); border-radius:6px; z-index:10; max-height:240px; overflow:auto; }
  .suggest div { padding:6px 10px; cursor:pointer; }
  .suggest div:hover { background:var(--row); }
  .sub { color:var(--sub); }
  .dim { opacity:.4; }

  /* ---- 決算速報タブ ---- */
  .egrid { display:grid; gap:12px; grid-template-columns:minmax(0,1fr); }
  .egrid > * { min-width:0; }
  /* 一覧は必ずスクロール枠に収める (ピーク日は1000件近くあり、下段の詳細に辿り着けなくなる) */
  .a-list .scroll { max-height:50vh; overflow:auto; }
  /* 上段は 一覧75% + カレンダー25%、下段は チャート50% + 決算表50% */
  @media (min-width:1100px){
    .egrid { grid-template-columns:repeat(4,minmax(0,1fr)); align-items:start; }
    .a-list { grid-column:span 3; } .a-cal { grid-column:span 1; }
    .a-chart { grid-column:span 2; } .a-fin { grid-column:span 2; }
    .a-list .scroll { max-height:46vh; }
    .a-cal { max-width:360px; justify-self:end; }
  }
  #earn-tbl th, #earn-tbl td { padding:5px 6px; }
  .phead { display:flex; align-items:baseline; gap:8px; justify-content:space-between; margin-bottom:8px; }
  .phead h3 { margin:0; }
  summary { cursor:pointer; color:var(--sub); }
  td.num { font-variant-numeric:tabular-nums; }
  .grp { border-left:1px solid var(--border); }
  #earn-list:focus { outline:none; }
  #earn-tbl thead th { z-index:1; }
  #earn-tbl thead tr:nth-child(2) th { top:29px; }   /* 2段ヘッダの下段 */
  #earn-tbl tbody tr { cursor:pointer; }
  #earn-tbl tbody tr:hover { background:var(--row); }
  #earn-tbl tbody tr.sel { background:var(--row-sel); box-shadow:inset 3px 0 0 var(--accent); }
  table.fin td:first-child, table.fin th:first-child { position:sticky; left:0; z-index:2; background:var(--panel); }
  table.fin { font-variant-numeric:tabular-nums; }
  table.fin th { font-size:11px; letter-spacing:.02em; }
  table.fin td { padding:7px 8px; vertical-align:top; }
  table.fin td.num { font-size:13px; font-weight:500; }
  table.fin .g { display:block; font-size:11px; font-weight:400; line-height:1.35; min-height:1.35em; }
  table.fin tbody tr:nth-child(even) td { background:var(--row); }
  table.fin tbody tr:hover td { background:var(--row-sel); }
  table.fin tr.now td { background:var(--now) !important; color:var(--text); }
  table.fin tr.now td:first-child { font-weight:600; background:var(--now) !important; box-shadow:inset 3px 0 0 var(--warn); }
  table.fin tr.fc td { background:#f0f7fc !important; }
  table.fin tr.prevfy td { opacity:.78; }
  table.fin tr.sep td { border-top:1px solid var(--border); }
  table.fin .loss { color:var(--up); }
  /* 月次タブ: TOP と Detail は同じ一段。1100px でも二段組にしない */
  #monthly-groups { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .mchip { background:transparent; border:1px solid var(--border); color:var(--sub); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:13px; }
  .mchip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* Detail はカード枠なし。main の左右余白も潰して横幅を取る。背景は白 */
  #monthly-top,
  #monthly-detail {
    background:#fff;
    margin:-12px;
    padding:10px 8px 32px;
  }
  #monthly-detail {
    min-height:calc(100vh - 52px);
  }
  #monthly-tbl {
    width:max-content; min-width:100%;
    border-collapse:collapse;
    background:#fff;
  }
  #monthly-tbl th,
  #monthly-tbl td {
    border:1px solid var(--border);
    background:#fff;
    padding:6px 8px;
  }
  #monthly-tbl th:first-child,
  #monthly-tbl td.name {
    white-space:nowrap;
    width:1%;
  }
  #monthly-tbl td.name { cursor:pointer; color:var(--accent); }
  #monthly-tbl td.name:hover { text-decoration:underline; }
  .badge.new { background:var(--warn); color:#fff; margin-left:6px; }
  #monthly-back { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px; }
  #monthly-chart { width:100%; min-height:220px; margin:0 0 16px; }
  #monthly-chart svg { width:100%; height:auto; display:block; font-family:inherit; overflow:visible; }
  /* 年表は table-layout:fixed + 月列等幅のまま。項目列は min-width で潰さず wrap が横スクロール */
  table.monthly {
    font-variant-numeric:tabular-nums;
    table-layout:fixed;
    width:max-content;
    min-width:100%;
    background:#fff;
    border-collapse:collapse;
  }
  table.monthly col.monthly-name { width:16em; min-width:16em; }
  table.monthly col.monthly-m { width: var(--monthly-m-w); }
  table.monthly th,
  table.monthly td {
    border:1px solid var(--border);
    background:#fff;
  }
  /* 月列は左右 sticky しない。横スワイプで月が普通に動く */
  table.monthly thead th:not(:first-child),
  table.monthly td.num,
  table.monthly th:last-child,
  table.monthly td:last-child {
    width: var(--monthly-m-w);
    position:static; left:auto; right:auto;
  }
  table.monthly thead th:first-child,
  table.monthly td:first-child {
    min-width:16em; width:16em;
    position:sticky; left:0; z-index:2;
    background:var(--panel);
  }
  table.monthly td:first-child { font-weight:700; }
  table.monthly thead th.l,
  table.monthly thead th:first-child,
  table.monthly thead th.year {
    z-index:3;
    background:var(--up);
    color:#fff;
    font-weight:700;
    font-size:13px;
  }
  table.monthly tbody tr:nth-child(even) td,
  table.monthly tbody tr:nth-child(even) td:first-child {
    background:#fff;
  }
  table.monthly tbody tr:hover td,
  table.monthly tbody tr:hover td:first-child {
    background:var(--row-sel);
  }
  table.monthly tbody tr[data-series].on td,
  table.monthly tbody tr[data-series].on td:first-child {
    background:var(--row-sel);
  }
  #monthly-table-wrap { display:flex; flex-direction:column; gap:1.75rem; overflow-x:auto; min-width:0; background:#fff; }
  table.monthly thead th { top:auto; }
  #monthly-series { max-width:100%; margin:0 0 8px; }
  table.monthly tbody tr[data-series] { cursor:pointer; }
  .fin-tabs { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .ftab { background:transparent; border:none; color:var(--sub); padding:5px 14px; cursor:pointer; font-size:13px; }
  .ftab.on { background:var(--accent); color:#fff; }
  .qchips { display:flex; gap:6px; margin:0 0 8px; }
  .qchip { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--sub); }
  .qchip.on { border-color:var(--warn); color:var(--warn); background:rgba(240,160,32,.12); }
  .qb { display:inline-block; margin-left:6px; font-size:10px; padding:0 5px; border-radius:3px; background:var(--row); color:var(--sub); vertical-align:middle; }
  .qb-1Q { color:#c48a00; }
  .qb-2Q { color:#1b8a5a; }
  .qb-3Q { color:#0077b6; }
  .qb-4Q { color:#8e4ec6; }
  .a-fin .tbl-wrap { max-height:min(52vh, 560px); }
  .cards { display:grid; gap:8px; }
  .card { border:1px solid var(--border); border-radius:8px; padding:8px; cursor:pointer; }
  .card.sel { border-color:var(--accent); background:var(--row-sel); }
  .card .ch { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
  .card .cg { display:grid; grid-template-columns:auto 1fr 1fr; gap:2px 10px; font-size:12px; }
  .card .cg .hd { color:var(--sub); }
  .card .cg .v { text-align:right; font-variant-numeric:tabular-nums; }

  @media (max-width:640px){
    body{font-size:13px} th,td{padding:4px 5px; font-size:12px} .cal .d{min-height:40px}
    table.fin .disc, table.fin th.disc { display:none; }
    .evt-toggles .evt-label { min-height:32px; }
    #monthly-chart { min-height:280px; }
    /* 16em sticky だと項目列が画面の大半を占め月が右端にしか出ない。スマホは sticky を外し項目列を短くする */
    table.monthly col.monthly-name { width:8em; min-width:8em; }
    table.monthly thead th:first-child,
    table.monthly td:first-child {
      min-width:8em; width:8em;
      position:static; left:auto; right:auto; z-index:auto;
      white-space:normal;
      overflow:hidden;
      background:#fff;
    }
    table.monthly thead th:first-child,
    table.monthly thead th.year {
      background:var(--up);
      color:#fff;
    }
    table.monthly tbody tr:nth-child(even) td,
    table.monthly tbody tr:nth-child(even) td:first-child { background:#fff; }
    table.monthly tbody tr:hover td,
    table.monthly tbody tr:hover td:first-child { background:var(--row-sel); }
    table.monthly tbody tr[data-series].on td,
    table.monthly tbody tr[data-series].on td:first-child { background:var(--row-sel); }
    table.monthly thead th:not(:first-child),
    table.monthly td.num,
    table.monthly th:last-child,
    table.monthly td:last-child {
      position:static; left:auto; right:auto;
    }
  }
</style>
</head>
<body>
<header>
  <h1>📈 株式分析</h1>
  <nav>
    <button data-tab="earnings" class="active">決算速報</button>
    <button data-tab="chart">チャート</button>
    <button data-tab="screener">スクリーナー</button>
    <button data-tab="monthly">月次</button>
  </nav>
</header>
<main>

<section id="tab-earnings">
  <div class="egrid">

    <div class="panel a-list">
      <div class="phead">
        <h3 id="earn-title">日付を選択してください</h3>
        <span class="sub" id="earn-count" style="font-size:12px"></span>
      </div>
      <div class="tbl-wrap scroll" id="earn-list" tabindex="0"></div>
    </div>

    <details class="panel a-cal" id="cal-panel">
      <summary>決算カレンダー</summary>
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="calMove(-1)">◀</button>
        <b id="cal-title"></b>
        <button class="btn" onclick="calMove(1)">▶</button>
      </div>
      <div class="cal" id="cal"></div>
    </details>

    <div class="panel a-chart">
      <div class="phead"><h3 id="e-chart-title">銘柄を選択してください</h3></div>
      <div id="e-chart" style="height:320px"></div>
      <div class="evt-toggles"></div>
    </div>

    <div class="panel a-fin">
      <div class="phead">
        <div class="fin-tabs">
          <button type="button" class="ftab on" data-fin="cum">累計</button>
          <button type="button" class="ftab" data-fin="q">3か月</button>
        </div>
        <span class="sub" style="font-size:12px">単位: 百万円 / EPSは円</span>
      </div>
      <div class="qchips" id="q-chips"></div>
      <div class="tbl-wrap" id="cum-wrap"><table class="fin" id="cum-tbl"></table></div>
      <div class="tbl-wrap" id="q-wrap" hidden><table class="fin" id="q-tbl"></table></div>
    </div>

  </div>
</section>

<section id="tab-chart" style="display:none">
  <div class="panel">
    <div class="row" style="position:relative">
      <input id="sym" placeholder="銘柄名 or コード" autocomplete="off" style="width:200px">
      <div id="suggest" class="suggest" style="display:none"></div>
      <select id="tf"><option value="D">日足</option><option value="W">週足</option><option value="M">月足</option></select>
      <input id="mas" value="50,150,200" style="width:110px" title="移動平均(カンマ区切り)">
      <label><input type="checkbox" id="rel"> 対TOPIX</label>
      <button class="btn" onclick="loadChart()">表示</button>
    </div>
    <div id="chart-title"></div>
    <div id="chart" style="height:420px"></div>
    <div class="evt-toggles"></div>
    <div id="relwrap" style="display:none"><h3>対TOPIX相対 (期首=100)</h3><div id="relchart" style="height:160px"></div></div>
  </div>
  <div class="panel">
    <h3>決算発表後パフォーマンス (%, α=対TOPIX超過)</h3>
    <div class="tbl-wrap"><table id="perf-tbl"></table></div>
  </div>
</section>

<section id="tab-screener" style="display:none">
  <div class="panel">
    <div class="row">
      ステージ:
      <select id="sc-stage">
        <option value="">全て</option><option value="2" selected>Stage 2 (上昇)</option>
        <option value="1">Stage 1 (底固め)</option><option value="3">Stage 3 (天井圏)</option>
        <option value="4">Stage 4 (下降)</option>
      </select>
      RS≧ <input id="sc-rs" type="number" value="70" style="width:70px">
      <button class="btn" onclick="loadScreener()">検索</button>
      <span id="sc-date" style="color:var(--sub)"></span>
    </div>
    <div class="tbl-wrap"><table id="sc-tbl"></table></div>
  </div>
</section>

<section id="tab-monthly" style="display:none">
  <div id="monthly-top">
    <div class="phead"><h3>月次データ</h3></div>
    <div id="monthly-groups"></div>
    <div class="tbl-wrap" id="monthly-list"></div>
  </div>
  <div id="monthly-detail" style="display:none">
      <div class="phead">
        <button type="button" id="monthly-back" onclick="backMonthly()">戻る</button>
        <h3 id="monthly-title"></h3>
      </div>
      <select id="monthly-series" onchange="setMonthlySeries(this.value)"></select>
      <div id="monthly-chart"></div>
      <div class="tbl-wrap" id="monthly-table-wrap"></div>
  </div>
</section>

</main>
<script>
const $ = s => document.querySelector(s);
const api = p => fetch(p).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
const fmt = (v,d=0) => v==null ? "–" : Number(v).toLocaleString("ja-JP",{maximumFractionDigits:d,minimumFractionDigits:d});
const pct = v => v==null ? "–" : `<span class="${v>=0?'pos':'neg'}">${v>0?'+':''}${fmt(v,1)}%</span>`;
// APIは円で返す。決算表の金額表示だけ百万円に換算する
const mil = v => v==null ? "–" : fmt(v/1e6, 0);
// 増減率セル: 前期が赤字/ゼロだと比率に意味がないので状態バッジで出す
const GST = {turn_profit:["黒転","up"], turn_loss:["赤転","dn"], loss:["赤継",null]};
function gc(c){
  if(!c || c.state==="na") return "–";
  if(c.state==="up" || c.state==="down"){
    // 2倍以上は株たんと同じく倍数表記 (420% → 5.2倍)
    if(c.pct != null && c.pct >= 100) return `<span class="pos">${fmt(c.pct/100+1,1)}倍</span>`;
    return pct(c.pct);
  }
  const [txt,cls] = GST[c.state] || ["–", null];
  return cls ? `<span class="badge ${cls}">${txt}</span>` : `<span class="sub">${txt}</span>`;
}

// ---- tabs ----
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  ["earnings","chart","screener","monthly"].forEach(t => $("#tab-"+t).style.display = t===b.dataset.tab?"":"none");
  document.querySelector("main").classList.toggle("wide", b.dataset.tab==="earnings" || b.dataset.tab==="monthly");
  if (b.dataset.tab==="screener" && !$("#sc-tbl").innerHTML) loadScreener();
  if (b.dataset.tab==="monthly") loadMonthlyList();
});

// ---- 決算カレンダー ----
let calY, calM, selDate=null;
(()=>{ const t=new Date(); calY=t.getFullYear(); calM=t.getMonth()+1; })();
function calMove(d){ calM+=d; if(calM>12){calM=1;calY++} if(calM<1){calM=12;calY--} renderCal(); }
async function renderCal(){
  const mm = `${calY}-${String(calM).padStart(2,"0")}`;
  $("#cal-title").textContent = `${calY}年${calM}月`;
  const counts = await api(`/api/earnings/calendar?month=${mm}`).catch(()=>({}));
  const first = new Date(calY, calM-1, 1), days = new Date(calY, calM, 0).getDate();
  let html = ["日","月","火","水","木","金","土"].map(d=>`<div class="h">${d}</div>`).join("");
  for(let i=0;i<first.getDay();i++) html += "<div></div>";
  for(let d=1;d<=days;d++){
    const ds = `${mm}-${String(d).padStart(2,"0")}`;
    const c = counts[ds];
    html += `<div class="d ${ds===selDate?'sel':''}" onclick="selectDate('${ds}')"><div class="n">${d}</div>${c?`<div class="cnt">${c}件</div>`:""}</div>`;
  }
  $("#cal").innerHTML = html;
}
// ---- 決算速報 一覧(マスター) / 詳細(ディテール) ----
const MET = [["net_sales","売上"],["operating_profit","営利"],["ordinary_profit","経利"],["profit","純利"]];
const mqNarrow = window.matchMedia("(max-width:700px)");
// 既出期間の再提出で損益が変わったもの (値がそのままの再提出はAPI側で除外済み)
const revBadge = r => r.restated ? `<span class="badge rev" title="既出期間の訂正">訂正</span>` : "";
let earnRows=[], selNo=null, detailReq=0;

async function selectDate(ds){
  selDate = ds; renderCal();
  $("#earn-title").textContent = `${ds} の決算発表`;
  earnRows = await api(`/api/earnings?date=${ds}`).catch(()=>[]);
  $("#earn-count").textContent = earnRows.length ? `${earnRows.length}件` : "";
  selNo = null;
  renderList();

  else clearDetail("開示なし");

function renderList(){
  if(!earnRows.length){ $("#earn-list").innerHTML = `<div class="sub">開示なし</div>`; return; }
  $("#earn-list").innerHTML = mqNarrow.matches ? cardsHtml() : tableHtml();
  markSel();
}

function tableHtml(){
  // 2段ヘッダにして列幅を詰める (1段だと「売上QoQ」等で8列が横に収まらない)
  const sub = () => MET.map(([k,l],i) => `<th class="${i?'':'grp'}">${l}</th>`).join("");
  let h = `<table id="earn-tbl"><thead>`
        + `<tr><th rowspan="2">時刻</th><th rowspan="2" class="l">銘柄</th>`
        + `<th rowspan="2" class="l">期</th><th rowspan="2">Q</th>`
        + `<th colspan="4" class="grp">QoQ (3か月)</th><th colspan="4" class="grp">YoY (累計)</th></tr>`
        + `<tr>${sub()}${sub()}</tr></thead><tbody>`;
  for(const r of earnRows){
    // 1QのQoQは前事業年度の4Q単独が相手になる (季節性が断絶するため注記する)
    const tip = r.period==="1Q" ? ' title="前期4Q単独比"' : "";
    h += `<tr data-no="${r.disclosure_no}" onclick="selectRow('${r.disclosure_no}')">`
       + `<td>${(r.disclosed_time||"").slice(0,5)}</td>`
       + `<td class="l">${r.name} <small class="sub">${r.code.slice(0,4)}</small>${revBadge(r)}</td>`
       + `<td class="l">${r.fy_label}</td><td>${r.period||""}</td>`
       + MET.map(([k],i)=>`<td class="num ${i?'':'grp'}"${tip}>${gc((r.qoq||{})[k])}</td>`).join("")
       + MET.map(([k],i)=>`<td class="num ${i?'':'grp'}">${gc((r.yoy||{})[k])}</td>`).join("")
       + `</tr>`;
  }
  return h + `</tbody></table>`;
}

function cardsHtml(){
  return `<div class="cards">` + earnRows.map(r =>
    `<div class="card" data-no="${r.disclosure_no}" onclick="selectRow('${r.disclosure_no}')">
       <div class="ch"><b>${(r.disclosed_time||"").slice(0,5)}</b><span>${r.name}</span>
         <small class="sub">${r.code.slice(0,4)} / ${r.fy_label} ${r.period||""}</small>${revBadge(r)}</div>
       <div class="cg"><span class="hd"></span><span class="hd v">QoQ</span><span class="hd v">YoY</span>`
     + MET.map(([k,l])=>`<span class="hd">${l}</span><span class="v">${gc((r.qoq||{})[k])}</span><span class="v">${gc((r.yoy||{})[k])}</span>`).join("")
     + `</div></div>`).join("") + `</div>`;
}

function selectRow(no, scroll){

async function loadDetail(row){
  const my = ++detailReq;                      // 連続選択時に古いレスポンスで上書きしない
  $("#e-chart-title").innerHTML = `<span class="clicky" onclick="gotoChart('${row.code}')">${row.name}</span>
    <small class="sub">${row.code.slice(0,4)} / ${row.fy_label} ${row.period||""}</small>`;
  const [d, ch] = await Promise.all([
    api(`/api/earnings/detail/${row.code}?disclosure_no=${encodeURIComponent(row.disclosure_no)}`).catch(()=>null),
    api(`/api/chart/${row.code}?tf=D&ma=50,150,200`).catch(()=>null)]);
  if(my !== detailReq) return;
  if(ch) eChartObj = renderPriceChart($("#e-chart"), ch, {height:320, prev:eChartObj, mark:d && d.disclosed_date});
  else { $("#e-chart").innerHTML = `<div class="sub">株価データなし</div>`; }
  renderQchips(d && d.period);
  renderFin($("#cum-tbl"), d && d.cumulative, d);
  renderFin($("#q-tbl"),   d && d.quarterly,  d);
}

const FIN_MET = [["net_sales","売上高"],["operating_profit","営業益"],
                 ["ordinary_profit","経常益"],["profit","最終益"]];
function disc(iso){ if(!iso) return "–"; const [y,m,d]=iso.split("-"); return `${y.slice(2)}/${m}/${d}`; }
function opm(v){
  const s = v && v.net_sales, o = v && v.operating_profit;
  if(s == null || s <= 0 || o == null) return null;
  return o / s * 100;
}
function amt(v){
  if(v == null) return "–";
  return `<span class="${v<0?"loss":""}">${mil(v)}</span>`;
}
function epsTxt(v){
  if(v == null) return "–";
  return `<span class="${v<0?"loss":""}">${fmt(v,1)}</span>`;
}
function finLabel(r){
  const base = r.range || r.label;
  if(r.kind==="forecast_fy") return `${base} 通期予想`;
  if(r.kind==="forecast_h") return `${base} 中間予想`;
  if(r.kind==="actual_fy_prev") return `${base} 通期`;
  return base;
}
function qBadge(r){
  // 4Q も FY と同じ通期累計。バッジは Q単独行だけ (累計の通期に 4Q を付けない)
  let q = r.period || "";
  if(r.kind==="single" && q==="FY") q = "4Q";
  if(r.kind!=="single" && (q==="4Q" || q==="FY")) return "";
  if(q==="5Q") return `<span class="qb">5Q</span>`;
  return /^[1-4]Q$/.test(q) ? `<span class="qb qb-${q}">${q}</span>` : "";
}
function renderQchips(period){
  const cur = (period==="FY" || period==="4Q") ? "" : (period || "");
  $("#q-chips").innerHTML = ["1Q","2Q","3Q","4Q"]
    .map(q => `<span class="qchip${q===cur?" on":""}">${q}</span>`).join("");
}
function renderFin(el, rows, d){
  if(!rows || !rows.length){
    el.innerHTML = `<tr><td class="l sub">${d && d.notes && d.notes.single_unavailable ? "算出不能 (決算期変更など)" : "データなし"}</td></tr>`;
    return;
  }
  const dim = d && d.notes && d.notes.no_ordinary;          // IFRS/米国基準は経常利益が無い
  const dc = k => k==="ordinary_profit" && dim ? " dim" : "";
  let h = `<thead><tr><th class="l">決算期</th>`
        + FIN_MET.map(([k,l])=>`<th class="${dc(k).trim()}">${l}</th>`).join("")
        + `<th>EPS</th><th>営利率</th><th class="disc">発表日</th></tr></thead><tbody>`;
  let hi = -1;
  rows.forEach((r,i) => { if(r.kind==="actual_current" || r.kind==="single") hi = i; });
  const extra = r => r.kind==="actual_fy_prev" || String(r.kind||"").startsWith("forecast");
  rows.forEach((r,i) => {
    const now = r.kind==="actual_current" || (r.kind==="single" && i===hi);
    const fc = String(r.kind||"").startsWith("forecast");
    const prev = r.kind==="actual_fy_prev";
    const sep = extra(r) && !rows.slice(0,i).some(extra);
    const cls = [now&&"now", fc&&"fc", prev&&"prevfy", sep&&"sep"].filter(Boolean).join(" ");
    const cell = (k, txt) => {
      const g = r.growth && r.growth[k];
      return `<td class="num${dc(k)}">${txt}<span class="g">${g ? gc(g) : " "}</span></td>`;
    };
    const m = opm(r.values);
    const mTxt = m==null ? "–" : `<span class="${m<0?"loss":""}">${fmt(m,1)}%</span>`;
    h += `<tr class="${cls}"><td class="l" title="${r.label||""}">${finLabel(r)}${qBadge(r)}</td>`
       + FIN_MET.map(([k])=>cell(k, amt(r.values[k]))).join("")
       + cell("eps", epsTxt(r.values.eps))
       + `<td class="num">${mTxt}<span class="g"> </span></td>`
       + `<td class="num disc sub">${disc(r.disclosed_date)}</td></tr>`;
  });
  el.innerHTML = h + `</tbody>`;
}

let chartObj=null, relObj=null, curCode=null, eChartObj=null;

function chartTheme(){
  const s = getComputedStyle(document.documentElement);
  const v = n => s.getPropertyValue(n).trim();
  return {text:v("--sub"), grid:v("--grid"), border:v("--border"),
          up:v("--up"), down:v("--down"), accent:v("--accent"), warn:v("--warn")};
}

// イベント重ね合わせ。既定オフ。種別を足すときは EVENT_LAYERS と API の日付配列だけ増やす
const EVENT_LAYERS = [
  {id:"earnings", label:"決算発表", color:"warn", text:"決", key:"earnings_dates"},
];
function loadEvtOn(){
  const base = {};
  EVENT_LAYERS.forEach(l => { base[l.id] = false; });
  try {
    const saved = JSON.parse(localStorage.getItem("chartEventOverlays") || "{}");
    for(const l of EVENT_LAYERS){
      if(typeof saved[l.id] === "boolean") base[l.id] = saved[l.id];
    }
  } catch(e) {}
  return base;
}
let evtOn = loadEvtOn();

function snapEventTime(t, dates, candles){
  if(dates.has(t)) return t;
  // 週足・月足は足の日付が期間末。発表日を含む足（初めて time >= 発表日）に載せる
  for(const c of candles){
    if(c.time >= t) return c.time;
  }
  return null;
}
function applyChartMarkers(state){
  if(!state || !state.cs) return;
  const {cs, d, dates, opt} = state;
  const th = chartTheme();
  const hi = th.accent;
  const byTime = new Map();
  const put = (raw, color, text) => {
    const t = snapEventTime(raw, dates, d.candles);
    if(!t) return;
    const prev = byTime.get(t);
    if(!prev || color === hi)
      byTime.set(t, {time:t, position:"belowBar", color, shape:"arrowUp", text});
  };
  for(const layer of EVENT_LAYERS){
    if(!evtOn[layer.id]) continue;
    for(const t of (d[layer.key] || [])) put(t, th[layer.color] || th.warn, layer.text);
  }
  // 決算タブで選んでいる発表日だけは、重ね合わせオフでも1件出す
  if(opt.mark) put(opt.mark, hi, "決");
  cs.setMarkers([...byTime.values()]);
}
function refreshEventMarkers(){
  if(chartObj && chartObj._sa) applyChartMarkers(chartObj._sa);
  if(eChartObj && eChartObj._sa) applyChartMarkers(eChartObj._sa);
}
function fillEventToggles(){
  const html = `<span class="evt-cap">イベント</span>` + EVENT_LAYERS.map(l =>
    `<label class="evt-label"><input type="checkbox" data-evt="${l.id}"${evtOn[l.id]?" checked":""}>
       <span class="swatch" style="background:var(--${l.color})"></span>${l.label}</label>`
  ).join("");
  document.querySelectorAll(".evt-toggles").forEach(el => {
    el.innerHTML = html;
    el.addEventListener("change", e => {
      const inp = e.target.closest("input[data-evt]");
      if(!inp) return;
      evtOn[inp.dataset.evt] = inp.checked;
      try { localStorage.setItem("chartEventOverlays", JSON.stringify(evtOn)); } catch(err) {}
      document.querySelectorAll(`input[data-evt="${inp.dataset.evt}"]`).forEach(x => { x.checked = inp.checked; });
      refreshEventMarkers();
    });
  });
}

// 決算タブは行選択のたびに描き直すので、必ず前のインスタンスを破棄してから作る
function renderPriceChart(el, d, opt={}){
  if(opt.prev){ try { opt.prev.remove(); } catch(e) {} }
  el.innerHTML = "";
  const th = chartTheme();
  const c = LightweightCharts.createChart(el, {
    height:opt.height||420, autoSize:true,
    layout:{background:{color:"transparent"},textColor:th.text},
    grid:{vertLines:{color:th.grid},horzLines:{color:th.grid}}, timeScale:{borderColor:th.border},
    rightPriceScale:{borderColor:th.border}});
  const cs = c.addCandlestickSeries({upColor:th.up,downColor:th.down,borderVisible:false,
                                     wickUpColor:th.up,wickDownColor:th.down});
  cs.setData(d.candles);
  const dates = new Set(d.candles.map(x=>x.time));
  c._sa = {cs, d, dates, opt};
  applyChartMarkers(c._sa);
  const colors=[th.accent, th.warn, "#8e4ec6", th.down];
  Object.entries(d.ma).forEach(([w,pts],i)=>{
    c.addLineSeries({color:colors[i%4],lineWidth:1,priceLineVisible:false,lastValueVisible:false,
                     title:`MA${w}`}).setData(pts);
  });
  c.timeScale().fitContent();
  // autoSize は生成後のレイアウトで幅が確定するため、確定後にもう一度フィットさせる
  requestAnimationFrame(() => { try { c.timeScale().fitContent(); } catch(e) {} });
  return c;
}

    relObj.addLineSeries({color:th.warn,lineWidth:2}).setData(d.relative);

      <td>${pct(p.return_5d)}</td><td>${pct(p.alpha_5d)}</td><td>${pct(p.return_20d)}</td><td>${pct(p.alpha_20d)}</td>
      <td>${pct(p.return_60d)}</td><td>${pct(p.alpha_60d)}</td><td>${pct(p.return_to_date)}</td><td>${pct(p.alpha_to_date)}</td></tr>`;
  }

}

// ---- 月次 ----
let monthlyRows=[], monthlyGroup="__new__", selMonthlyCode=null;
let monthlySeries="", monthlyYearTables=[];
const MONTHLY_YEAR_COLORS = ["#0077b6","#2e8b57","#b8860b","#8e4ec6"];

function uniqueMonthlyIssuers(rows){
  const seen = new Set();
  const out = [];
  for(const r of rows || []){
    const code = r && r.code;
    if(!code || seen.has(code)) continue;
    seen.add(code);
    out.push(r);
  }
  return out;
}

function monthlyElementKey(name){
  return String(name || "").normalize("NFKC").replace(/\s+/g, "");
}

function monthlySeriesKind(element, unit){
  const key = monthlyElementKey(element);
  const u = unit || "number";
  if(key.includes("店舗数") && u==="number") return "stores";
  if(u!=="yoy_index" && u!=="yoy_pct") return null;
  if(key.includes("既存")) return "existing";
  if(key.includes("全店")) return "all_store";
  return null;
}

function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

function monthlySeriesChoices(tables){
  const seen = new Set();
  const out = [];
  for(const d of tables || []){
    for(const e of d.elements || []){
      const name = e.element;
      if(!name || seen.has(name)) continue;
      seen.add(name);
      const unit = e.unit || "number";
      out.push({
        id: name,
        label: fmtMonthlyElement(name, unit),
        yoy: unit==="yoy_index" || unit==="yoy_pct",
      });
    }
  }
  return out;
}

function pickDefaultMonthlySeries(tables){
  for(const d of tables || []){
    for(const e of d.elements || []){
      if(monthlySeriesKind(e.element, e.unit) === "all_store") return e.element;
    }
  }
  const choices = monthlySeriesChoices(tables);
  return choices.length ? choices[0].id : "";
}

function monthlySeriesElement(d, seriesId){
  return (d.elements || []).find(e => e.element === seriesId);
}

function fmtMonthlyYoyList(v){
  if(v==null || v==="") return "";
  const n = Number(v);
  if(!Number.isFinite(n)) return "";
  return n.toLocaleString("ja-JP",{maximumFractionDigits:4});
}

function monthlyIndustries(issuers){
  const set = new Set();
  for(const r of issuers) set.add(r.industry || "その他");
  return [...set].sort((a,b) => a.localeCompare(b, "ja"));
}

function defaultMonthlyGroup(issuers){
  if(issuers.some(r => r.is_new)) return "__new__";
  const ind = monthlyIndustries(issuers);
  return ind[0] || "__new__";
}

function filteredMonthlyIssuers(){
  const issuers = uniqueMonthlyIssuers(monthlyRows);
  if(monthlyGroup==="__new__") return issuers.filter(r => r.is_new);
  return issuers.filter(r => (r.industry || "その他") === monthlyGroup);
}

async function loadMonthlyList(){
  showMonthlyTop();
  const rows = await api("/api/v1/tables").catch(()=>null);
  if(!Array.isArray(rows)){
    $("#monthly-groups").innerHTML = "";
    $("#monthly-list").innerHTML = `<div class="sub">登録された月次データはありません</div>`;
    return;
  }
  monthlyRows = rows;
  const issuers = uniqueMonthlyIssuers(monthlyRows);
  if(!issuers.length){
    $("#monthly-groups").innerHTML = "";
    $("#monthly-list").innerHTML = `<div class="sub">登録された月次データはありません</div>`;
    return;
  }
  const groups = monthlyIndustries(issuers);
  if(monthlyGroup!=="__new__" && !groups.includes(monthlyGroup)) monthlyGroup = defaultMonthlyGroup(issuers);
  else if(monthlyGroup==="__new__" && !issuers.some(r => r.is_new) && groups.length) monthlyGroup = groups[0];
  renderMonthlyGroups(groups);
  renderMonthlyList();
}

function renderMonthlyGroups(groups){
  let h = `<button type="button" class="mchip${monthlyGroup==="__new__"?" on":""}" data-group="__new__" onclick="setMonthlyGroup('__new__')">新着</button>`;
  for(const g of groups){
    const on = monthlyGroup===g ? " on" : "";
    h += `<button type="button" class="mchip${on}" data-group="${g.replace(/"/g,"&quot;")}" onclick="setMonthlyGroup(this.dataset.group)">${g}</button>`;
  }
  $("#monthly-groups").innerHTML = h;
}

function setMonthlyGroup(g){
  monthlyGroup = g;
  renderMonthlyGroups(monthlyIndustries(uniqueMonthlyIssuers(monthlyRows)));
  renderMonthlyList();
}

function fmtMonthlyIssuerLabel(code, name){
  const short = Array.from(String(name || "")).slice(0, 5).join("");
  return `「${code}」${short}`;
}

function renderMonthlyList(){
  const issuers = filteredMonthlyIssuers();
  if(!issuers.length){
    $("#monthly-list").innerHTML = `<div class="sub">登録された月次データはありません</div>`;
    return;
  }
  let h = `<table id="monthly-tbl"><thead><tr>` +
    `<th class="l">会社名</th><th class="l">市場</th><th class="l">業種</th>` +
    `<th class="l">月次業種</th><th>全店(前年比)</th><th>既存店(前年比)</th>` +
    `</tr></thead><tbody>`;
  for(const r of issuers){
    const neu = r.ingested_today ? `<span class="badge new">NEW</span>` : "";
    h += `<tr data-code="${r.code}">` +
      `<td class="l name" onclick="showMonthlyDetail('${r.code}')">${escHtml(fmtMonthlyIssuerLabel(r.code, r.name))}${neu}</td>` +
      `<td class="l">${r.market||""}</td>` +
      `<td class="l">${r.sector33||""}</td>` +
      `<td class="l">${r.industry||"その他"}</td>` +
      `<td class="num">${fmtMonthlyYoyList(r.all_store_yoy)}</td>` +
      `<td class="num">${fmtMonthlyYoyList(r.existing_store_yoy)}</td>` +
      `</tr>`;
  }
  $("#monthly-list").innerHTML = h + `</tbody></table>`;
}

function showMonthlyTop(){
  $("#monthly-top").style.display = "";
  $("#monthly-detail").style.display = "none";
}

function showMonthlyDetail(code){
  selMonthlyCode = code;
  const row = uniqueMonthlyIssuers(monthlyRows).find(r => r.code === code);
  if(!row) return;
  const nm = row.name || "";
  $("#monthly-title").textContent = nm ? `${nm} ${row.code}` : row.code;
  monthlySeries = "";
  $("#monthly-top").style.display = "none";
  $("#monthly-detail").style.display = "";
  loadMonthlyTables();
}

function backMonthly(){
  showMonthlyTop();
}

function renderMonthlySeriesSelect(){
  const choices = monthlySeriesChoices(monthlyYearTables);
  const sel = $("#monthly-series");
  if(!choices.length){
    sel.innerHTML = "";
    return;
  }
  if(!choices.some(s => s.id === monthlySeries)) monthlySeries = pickDefaultMonthlySeries(monthlyYearTables);
  sel.innerHTML = choices.map(s =>
    `<option value="${escHtml(s.id)}">${escHtml(s.label)}</option>`).join("");
  sel.value = monthlySeries;
}

function setMonthlySeries(id){
  monthlySeries = id;
  const sel = $("#monthly-series");
  if(sel && sel.value !== id) sel.value = id;
  drawMonthlyChart(monthlyYearTables, monthlySeries);
  markMonthlySeriesRows();
}

function markMonthlySeriesRows(){
  document.querySelectorAll("#monthly-table-wrap tr[data-series]").forEach(tr =>
    tr.classList.toggle("on", tr.dataset.series === monthlySeries));
}

async function loadMonthlyTables(){
  if(!selMonthlyCode) return;
  const wrap = $("#monthly-table-wrap");
  const info = await api(`/api/v1/tables/${selMonthlyCode}`).catch(()=>null);
  const years = ((info && info.years) || []).slice().sort((a,b)=>b-a);
  if(!years.length){
    monthlyYearTables = [];
    wrap.style.removeProperty("--monthly-m-w");
    wrap.innerHTML = `<div class="sub">データなし</div>`;
    renderMonthlySeriesSelect();
    drawMonthlyChart([], monthlySeries);
    return;
  }
  const tables = await Promise.all(
    years.map(y => api(`/api/v1/tables/${selMonthlyCode}/${y}`).catch(()=>null))
  );
  monthlyYearTables = tables.filter(Boolean);
  renderMonthlySeriesSelect();
  let h = "";
  let maxNumLen = 0;
  for(const d of tables){
    if(!d) continue;
    h += `<table class="fin monthly"><colgroup><col class="monthly-name"><col class="monthly-m" span="12"></colgroup><thead><tr><th class="l year">${d.year}</th>`;
    for(let m=1;m<=12;m++) h += `<th>${m}月</th>`;
    h += `</tr></thead><tbody>`;
    for(const e of d.elements || []){
      const vals = e.values || {};
      const unit = e.unit || "number";
      const ds = ` data-series="${escHtml(e.element)}" onclick="setMonthlySeries(this.dataset.series)"`;
      h += `<tr${ds}><td class="l">${fmtMonthlyElement(e.element, unit)}</td>`;
      for(let m=1;m<=12;m++){
        const v = vals[String(m)];
        const txt = fmtMonthlyCell(v, unit);
        if(txt) maxNumLen = Math.max(maxNumLen, txt.length);
        h += `<td class="num">${txt}</td>`;
      }
      h += `</tr>`;
    }
    h += `</tbody></table>`;
  }
  wrap.style.setProperty("--monthly-m-w", `calc(${Math.max(maxNumLen, 3)}ch + 16px)`);
  wrap.innerHTML = h || `<div class="sub">データなし</div>`;
  drawMonthlyChart(monthlyYearTables, monthlySeries);
  markMonthlySeriesRows();
}

function monthlyIsPhone(){
  return window.matchMedia("(max-width:640px)").matches;
}

function monthlyYTicks(ymin, ymax, yoy){
  const span = Math.max(ymax - ymin, yoy ? 20 : 1);
  const raw = span / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  let step;
  if(n <= 1) step = mag;
  else if(n <= 2) step = 2 * mag;
  else if(n <= 5) step = 5 * mag;
  else step = 10 * mag;
  const ticks = [];
  const start = Math.ceil((ymin - step * 1e-9) / step) * step;
  for(let v = start; v <= ymax + step * 1e-6; v += step){
    const t = Math.round(v / step) * step;
    let r = Math.abs(t) >= 100 ? Math.round(t) : Math.round(t * 100) / 100;
    if(Math.abs(r) < 1e-9) r = 0;
    if(!ticks.length || Math.abs(ticks[ticks.length-1] - r) > step * 0.01) ticks.push(r);
  }
  if(yoy && ymin <= 100 && 100 <= ymax && !ticks.some(t => Math.abs(t-100) < 1e-6)){
    ticks.push(100);
    ticks.sort((a,b)=>a-b);
  }
  return ticks.length ? ticks : [ymin, ymax];
}

function fmtMonthlyTick(v){
  if(Math.abs(v) < 1e-9) v = 0;
  if(Math.abs(v - Math.round(v)) < 1e-6)
    return Math.round(v).toLocaleString("ja-JP");
  return v.toLocaleString("ja-JP", {maximumFractionDigits:1});
}

let monthlyChartCssW = 0;

function drawMonthlyChart(tables, seriesId){
  const host = $("#monthly-chart");
  const choices = monthlySeriesChoices(tables);
  const spec = choices.find(s => s.id === seriesId) || choices[0];
  if(!spec){
    host.innerHTML = `<div class="sub">データなし</div>`;
    return;
  }
  const years = [];
  const byYear = {};
  for(const d of tables || []){
    const el = monthlySeriesElement(d, spec.id);
    if(!el) continue;
    const nums = [];
    let any = false;
    for(let m=1;m<=12;m++){
      const raw = el.values && el.values[String(m)];
      const n = raw==null || raw==="" ? null : Number(raw);
      let v = null;
      if(Number.isFinite(n)){
        v = el.unit==="yoy_pct" ? n+100 : n;
        any = true;
      }
      nums.push(v);
    }
    if(!any) continue;
    years.push(d.year);
    byYear[d.year] = nums;
  }
  years.sort((a,b)=>a-b);
  if(!years.length){
    host.innerHTML = `<div class="sub">データなし</div>`;
    return;
  }
  const vals = [];
  for(const y of years) for(const v of byYear[y]) if(v!=null) vals.push(v);
  let ymin = 0;
  let ymax = Math.max(...vals, spec.yoy ? 100 : 1);
  ymax = ymax * 1.08;
  // スマホは viewBox 720 を幅いっぱいに縮めると font-size 11 が読めない。1 CSS px ≒ 1 user unit にする
  const phone = monthlyIsPhone();
  const cssW = host.clientWidth || document.documentElement.clientWidth || 720;
  monthlyChartCssW = cssW;
  const W = phone ? Math.max(cssW, 280) : 720;
  const H = phone ? 280 : 232;
  const L = 52, R = phone ? 10 : 12, T = phone ? 18 : 14, B = phone ? 64 : 50;
  const fsAxis = phone ? 13 : 11;
  const plotW=W-L-R, plotH=H-T-B;
  const yx = v => T + (1 - (v-ymin)/((ymax-ymin)||1)) * plotH;
  const nY = years.length;
  const slot = plotW/12;
  const barW = Math.max(3, (slot*0.72)/nY);
  const monthY = T + plotH + (phone ? 18 : 14);
  const legendY = H - (phone ? 8 : 6);
  const legendGap = Math.min(phone ? 70 : 80, plotW / Math.max(nY, 1));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escHtml(spec.label)}">`;
  for(const tick of monthlyYTicks(ymin, ymax, spec.yoy)){
    const y = yx(tick);
    svg += `<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e8ecf0"/>`;
    svg += `<text x="${L-6}" y="${y.toFixed(1)}" font-size="${fsAxis}" text-anchor="end" dominant-baseline="middle" fill="#66707a">${fmtMonthlyTick(tick)}</text>`;
  }
  if(spec.yoy){
    const y100 = yx(100);
    svg += `<line x1="${L}" x2="${W-R}" y1="${y100}" y2="${y100}" stroke="#e6a100" stroke-dasharray="4 3"/>`;
  }
  years.forEach((year, yi) => {
    const color = MONTHLY_YEAR_COLORS[yi % MONTHLY_YEAR_COLORS.length];
    byYear[year].forEach((v, mi) => {
      if(v==null) return;
      const x = L + slot*mi + (slot-nY*barW)/2 + yi*barW;
      const y = yx(Math.max(v, ymin));
      const hgt = Math.max(1, yx(ymin) - y);
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${color}"/>`;
      if(spec.yoy && v<100){
        svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" fill="#d32f2f" fill-opacity="0.35"/>`;
      }
    });
  });
  const monthLabel = slot < 28 ? (m => String(m)) : (m => `${m}月`);
  for(let m=1;m<=12;m++){
    const x = L + slot*(m-1) + slot/2;
    svg += `<text x="${x.toFixed(1)}" y="${monthY}" font-size="${fsAxis}" text-anchor="middle" fill="#66707a">${monthLabel(m)}</text>`;
  }
  years.forEach((year, yi) => {
    const color = MONTHLY_YEAR_COLORS[yi % MONTHLY_YEAR_COLORS.length];
    const x = L + yi*legendGap;
    svg += `<rect x="${x}" y="${legendY-10}" width="8" height="8" fill="${color}"/>`;
    svg += `<text x="${x+12}" y="${legendY}" font-size="${fsAxis}" fill="#66707a">${year}年</text>`;
  });
  svg += `</svg>`;
  host.innerHTML = svg;
}

window.matchMedia("(max-width:640px)").addEventListener("change", () => {
  if(monthlyYearTables.length) drawMonthlyChart(monthlyYearTables, monthlySeries);
});
window.addEventListener("resize", () => {
  const host = $("#monthly-chart");
  if(!host || !$("#monthly-detail") || $("#monthly-detail").style.display === "none") return;
  if(Math.abs((host.clientWidth || 0) - monthlyChartCssW) < 8) return;
  if(monthlyYearTables.length) drawMonthlyChart(monthlyYearTables, monthlySeries);
});

function fmtMonthlyCell(v, unit){
  if(v==null || v==="") return "";
  let n = Number(v);
  if(!Number.isFinite(n)) return "";
  if(unit==="yoy_pct") n += 100;
  return n.toLocaleString("ja-JP",{maximumFractionDigits:4});
}

function stripYoyFragments(name){
  const frags = ["前年同月比","前年同月","(前年比)","（前年比）","前年比"];
  let s = String(name || "").trim();
  let prev;
  do {
    prev = s;
    for(const frag of frags) s = s.split(frag).join("");
    s = s.replace(/\s+/g, " ").trim();
  } while(s !== prev);
  return s;
}

function fmtMonthlyElement(name, unit){
  const trimmed = String(name || "").trim();
  const u = unit || "number";
  if(u !== "yoy_index" && u !== "yoy_pct") return trimmed;
  const base = stripYoyFragments(trimmed);
  if(base.endsWith("(前年比)")) return base;
  return base + "(前年比)";
}

document.querySelector("main").classList.add("wide");
$("#cal-panel").open = window.innerWidth >= 1100;
fillEventToggles();
renderCal();

name: Monthly names

# 月次の保存名は起動時に書き換えない（#545）。正規化や issuer_aliases を変えたあと、ここから付け替える。
# 既定は plan（書かない）。ログを見てから apply で流し直す。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = 書かずに表示 / apply = 付け替える"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

jobs:
  run:
    name: Monthly names ${{ inputs.mode }}
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Require SSH key
        run: |
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "VPS_SSH_KEY が未設定です" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: SSH run monthly_names.py
        run: |
          set -euo pipefail
          case "$MODE" in
            plan|apply) ;;
            *) echo "mode は plan / apply" >&2; exit 1 ;;
          esac
          HOST="${VPS_HOST:-160.251.179.50}"
          USER="${VPS_USER:-stock}"
          PORT="${VPS_PORT:-22}"

          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          if "PRIVATE KEY" not in raw:
              raise SystemExit(
                  "VPS_SSH_KEY は秘密鍵 (-----BEGIN ... PRIVATE KEY-----) である必要があります。"
              )
          p = Path.home() / ".ssh" / "id_deploy"
          p.write_text(raw)
          p.chmod(0o600)
          PY

          echo "Run monthly_names.py ${MODE} on ${USER}@${HOST}"
          ssh -i "$HOME/.ssh/id_deploy" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            "${USER}@${HOST}" \
            "cd /home/stock/stock-analyzer && .venv/bin/python -u jobs/monthly_names.py ${MODE}"

name: CI/CD


on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/memory/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの上げ方（none は Release を作らずデプロイだけ）"
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      skip_deploy:
        description: "VPS デプロイをスキップ"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # main への push では走らせない（PR で通っている前提）。Run workflow では走る。
  # ランナーは変数 CI_TEST_RUNNER で替える。空なら ubuntu-latest。
  test:
    name: Test
    if: github.event_name != 'push'
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # GitHub-hosted images ship node; this persistent runner does not.
      # setup-node publishes linux-arm64 binaries into the runner tool cache.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Persistent runner: skip apt when nginx/openssl are already present.
      - name: Ensure nginx
        run: |
          set -euo pipefail
          echo "runner=$(hostname) arch=$(uname -m)"
          need=()
          if ! command -v nginx >/dev/null 2>&1 && [ ! -x /usr/sbin/nginx ]; then
            need+=(nginx-light)
          fi
          if ! command -v openssl >/dev/null 2>&1; then
            need+=(openssl)
          fi
          # tests/ops/test_cve_2026_98432.py が netns で nft を動かす。
          if ! command -v nft >/dev/null 2>&1; then
            need+=(nftables)
          fi
          if ! command -v ip >/dev/null 2>&1; then
            need+=(iproute2)
          fi
          if [ "${#need[@]}" -eq 0 ]; then
            nginx -v 2>&1 || /usr/sbin/nginx -v
            openssl version
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "${need[@]}"

      # tests/ops/test_monitoring.py が実物の vmalert-tool / Alertmanager / VictoriaMetrics を動かす。
      # 永続ランナーなので binaries.txt のハッシュごとに一度だけ落とす。GitHub ホストでは cache に置く。
      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.cache/stock-analyzer-monitoring
          key: monitoring-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/monitoring/binaries.txt') }}

      - name: Fetch monitoring binaries
        run: |
          set -euo pipefail
          key="$(sha256sum deploy/monitoring/binaries.txt | cut -c1-16)"
          dir="$HOME/.cache/stock-analyzer-monitoring/$key"
          if [ ! -x "$dir/victoria-metrics" ]; then
            bash deploy/monitoring/fetch.sh "$dir"
          fi
          echo "MONITORING_BIN_DIR=$dir" >> "$GITHUB_ENV"

      - name: Compile
        run: python -m compileall -q -f app jobs tests tools deploy mcp .cursor

      # --dataflow=check: テスト中の SQL から作った読み書き表と docs/DATA_FLOW.md が合わなければ落とす
      - name: Test
        run: python -m pytest tests -q --dataflow=check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 分課金なので Ruff と Bandit だけ入れる（版は requirements-dev.txt のまま）。
      - name: Install
        run: pip install $(grep -E '^(ruff|bandit)==' requirements-dev.txt)

      - name: No comments
        run: python -m tools.lint.no_comments

      - name: Ruff
        run: python -m ruff check --config config/pyproject.toml app jobs tests tools deploy mcp

      - name: Bandit
        run: python -m bandit -c config/pyproject.toml -r app jobs tests tools deploy mcp -x app/xbrlp,app/edinet_wrapper,.cursor,tmp,.venv

  release:
    name: Release
    needs: [test, lint]
    # push では test が skipped になる。skipped の needs があると既定では止まるので結果を自分で見る。
    if: |
      !cancelled()
      && (needs.test.result == 'success' || (github.event_name == 'push' && needs.test.result == 'skipped'))
      && needs.lint.result == 'success'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bump != 'none'))
    runs-on: [self-hosted, arm64]
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        env:
          BUMP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          prev="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          msgs=""
          if [ -n "$prev" ]; then
            msgs="$(git log "$prev"..HEAD --pretty=%s || true)"
          else
            msgs="$(git log --pretty=%s)"
          fi

          bump="$BUMP_INPUT"
          if [ "$bump" = "auto" ]; then
            bump=patch
            if echo "$msgs" | grep -qE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
              bump=major
            elif echo "$msgs" | grep -qE '^feat(\(.+\))?:'; then
              bump=minor
            fi
          fi

          if [ -z "$prev" ]; then
            tag="v0.1.0"
          else
            ver="${prev#v}"
            IFS=. read -r maj min pat <<< "$ver"
            maj=${maj:-0}; min=${min:-0}; pat=${pat:-0}
            case "$bump" in
              major) maj=$((maj+1)); min=0; pat=0 ;;
              minor) min=$((min+1)); pat=0 ;;
              patch) pat=$((pat+1)) ;;
              *) echo "unknown bump: $bump" >&2; exit 1 ;;
            esac
            tag="v${maj}.${min}.${pat}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next $tag (from ${prev:-none}, bump=$bump)"

          {
            echo "## ${tag}"
            echo
            if [ -n "$prev" ]; then
              git log "$prev"..HEAD --pretty=format:"- %s (%h)"
              echo
            else
              echo "初回リリース"
              echo
              git log --pretty=format:"- %s (%h)" | head -n 40
              echo
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          tag = os.environ["TAG"]
          notes = open(os.path.join(os.environ["RUNNER_TEMP"], "release-notes.md"), encoding="utf-8").read()
          payload = json.dumps({
              "tag_name": tag,
              "name": tag,
              "body": notes,
              "target_commitish": os.environ["GITHUB_SHA"],
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "stock-analyzer-cicd",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as exc:
              print(exc.read().decode(errors="replace"), file=sys.stderr)
              raise
          print(data.get("html_url", tag))
          PY

  deploy:
    name: Deploy VPS
    needs: [test, lint, release]
    if: |
      always()
      && (needs.test.result == 'success' || (github.event_name == 'push' && needs.test.result == 'skipped'))
      && needs.lint.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
      && github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch' || inputs.skip_deploy == false)
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30
    concurrency:
      group: vps-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL_APP: ${{ secrets.SLACK_WEBHOOK_URL_APP }}
      SLACK_WEBHOOK_URL_BATCH: ${{ secrets.SLACK_WEBHOOK_URL_BATCH }}
      SLACK_WEBHOOK_URL_INFRA: ${{ secrets.SLACK_WEBHOOK_URL_INFRA }}
      SLACK_WEBHOOK_URL_QUIET: ${{ secrets.SLACK_WEBHOOK_URL_QUIET }}
      VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
    steps:
      - name: Skip if no SSH key
        if: env.VPS_SSH_KEY == ''
        run: echo "::warning::VPS_SSH_KEY が未設定のため VPS デプロイをスキップします"

      - uses: actions/checkout@v4
        if: env.VPS_SSH_KEY != ''

      - name: SSH deploy
        if: env.VPS_SSH_KEY != ''
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-160.251.179.50}"
          USER="${VPS_USER:-stock}"
          PORT="${VPS_PORT:-22}"
          APP_DIR="/home/stock/stock-analyzer"

          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          if "PRIVATE KEY" not in raw:
              raise SystemExit(
                  "VPS_SSH_KEY は秘密鍵 (-----BEGIN ... PRIVATE KEY-----) である必要があります。"
                  "公開鍵 (.pub) や ConoHa のキー名を入れていませんか?"
              )
          p = Path.home() / ".ssh" / "id_deploy"
          p.write_text(raw)
          p.chmod(0o600)
          PY

          echo "Deploy $GITHUB_SHA → ${USER}@${HOST}:${APP_DIR}"
          python3 - <<'PY' | ssh -i "$HOME/.ssh/id_deploy" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            "${USER}@${HOST}" \
            bash -s
          import os, shlex, pathlib, re, sys
          os.environ.setdefault("APP_DIR", "/home/stock/stock-analyzer")
          raw = (os.environ.get("VPS_DOMAIN") or "").strip().strip("\"'")
          raw = re.sub(r"^https?://", "", raw, flags=re.I)
          raw = raw.split("/")[0].strip()
          os.environ["VPS_DOMAIN"] = raw or "160.251.179.50.sslip.io"
          print(f"VPS_DOMAIN len={len(os.environ['VPS_DOMAIN'])}", file=sys.stderr)
          keys = [
              "APP_DIR",
              "VPS_DOMAIN",
              "JQUANTS_API_KEY",
              "ESTAT_APP_ID",
              "EDINET_API_KEY",
              "ANTHROPIC_API_KEY",
              "CERTBOT_EMAIL",
              "MCP_TOKEN",
              "CF_ACCESS_TEAM_DOMAIN",
              "CF_ACCESS_AUD",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "SLACK_WEBHOOK_URL",
              "SLACK_WEBHOOK_URL_APP",
              "SLACK_WEBHOOK_URL_BATCH",
              "SLACK_WEBHOOK_URL_INFRA",
              "SLACK_WEBHOOK_URL_QUIET",
          ]
          print("set -euo pipefail")
          for k in keys:
              print(f"export {k}={shlex.quote(os.environ.get(k, ''))}")
          print(pathlib.Path("deploy/update.sh").read_text())
          PY

      - name: Remove deploy key
        if: always()
        run: rm -f "$HOME/.ssh/id_deploy"

      # 失敗時だけ #alerts-infra。成功・キャンセルは送らない。送信失敗は job 結果を変えない。
      - name: Notify Slack on failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL_INFRA: ${{ secrets.SLACK_WEBHOOK_URL_INFRA }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY_KIND: deploy
        run: python3 tools/ops/notify_cicd_failure.py

  notify-skipped-deploy:
    name: Notify skipped deploy
    needs: [test, lint, release, deploy]
    if: |
      always()
      && !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.deploy.result != 'failure'
      && needs.deploy.result != 'cancelled'
      && (
        needs.test.result == 'failure'
        || needs.lint.result == 'failure'
        || needs.release.result == 'failure'
      )
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true

      - name: Notify Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL_INFRA: ${{ secrets.SLACK_WEBHOOK_URL_INFRA }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY_KIND: gate
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: python3 tools/ops/notify_cicd_failure.py

name: CI/CD

# PR: テストのみ
# main へマージ: テスト → タグと GitHub Release → ConoHa VPS へデプロイ
# 手動: Actions → CI/CD → Run workflow（再デプロイやバンプ指定）

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの上げ方（none は Release を作らずデプロイだけ）"
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      skip_deploy:
        description: "VPS デプロイをスキップ"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q -f app jobs tests tools deploy .cursor

      - name: Smoke
        run: python tests/ci_smoke.py

      - name: Log MCP
        run: python tests/test_log_mcp.py

      - name: Alert patterns
        run: python tests/test_alert_patterns.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check --config config/pyproject.toml app jobs tests tools deploy

      - name: Bandit
        run: python -m bandit -c config/pyproject.toml -r app jobs tests tools deploy -x app/xbrlp,.cursor,tmp,.venv

  release:
    name: Release
    needs: [test, lint]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bump != 'none')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        env:
          BUMP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          prev="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          msgs=""
          if [ -n "$prev" ]; then
            msgs="$(git log "$prev"..HEAD --pretty=%s || true)"
          else
            msgs="$(git log --pretty=%s)"
          fi

          bump="$BUMP_INPUT"
          if [ "$bump" = "auto" ]; then
            bump=patch
            if echo "$msgs" | grep -qE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
              bump=major
            elif echo "$msgs" | grep -qE '^feat(\(.+\))?:'; then
              bump=minor
            fi
          fi

          if [ -z "$prev" ]; then
            tag="v0.1.0"
          else
            ver="${prev#v}"
            IFS=. read -r maj min pat <<< "$ver"
            maj=${maj:-0}; min=${min:-0}; pat=${pat:-0}
            case "$bump" in
              major) maj=$((maj+1)); min=0; pat=0 ;;
              minor) min=$((min+1)); pat=0 ;;
              patch) pat=$((pat+1)) ;;
              *) echo "unknown bump: $bump" >&2; exit 1 ;;
            esac
            tag="v${maj}.${min}.${pat}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next $tag (from ${prev:-none}, bump=$bump)"

          {
            echo "## ${tag}"
            echo
            if [ -n "$prev" ]; then
              git log "$prev"..HEAD --pretty=format:"- %s (%h)"
              echo
            else
              echo "初回リリース"
              echo
              git log --pretty=format:"- %s (%h)" | head -n 40
              echo
            fi
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA"

  deploy:
    name: Deploy VPS
    needs: [test, lint, release]
    if: |
      always()
      && needs.test.result == 'success'
      && needs.lint.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
      && github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch' || inputs.skip_deploy == false)
    runs-on: ubuntu-latest
    concurrency:
      group: vps-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
      BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL_APP: ${{ secrets.SLACK_WEBHOOK_URL_APP }}
      SLACK_WEBHOOK_URL_BATCH: ${{ secrets.SLACK_WEBHOOK_URL_BATCH }}
      SLACK_WEBHOOK_URL_INFRA: ${{ secrets.SLACK_WEBHOOK_URL_INFRA }}
      SLACK_WEBHOOK_URL_QUIET: ${{ secrets.SLACK_WEBHOOK_URL_QUIET }}
      VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
    steps:
      - name: Skip if no SSH key
        if: env.VPS_SSH_KEY == ''
        run: echo "::warning::VPS_SSH_KEY が未設定のため VPS デプロイをスキップします"

      - uses: actions/checkout@v4
        if: env.VPS_SSH_KEY != ''

      - name: SSH deploy
        if: env.VPS_SSH_KEY != ''
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-160.251.179.50}"
          USER="${VPS_USER:-stock}"
          PORT="${VPS_PORT:-22}"
          APP_DIR="/home/stock/stock-analyzer"

          install -m 700 -d "$HOME/.ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["VPS_SSH_KEY"].replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          if "PRIVATE KEY" not in raw:
              raise SystemExit(
                  "VPS_SSH_KEY は秘密鍵 (-----BEGIN ... PRIVATE KEY-----) である必要があります。"
                  "公開鍵 (.pub) や ConoHa のキー名を入れていませんか?"
              )
          p = Path.home() / ".ssh" / "id_deploy"
          p.write_text(raw)
          p.chmod(0o600)
          PY

          echo "Deploy $GITHUB_SHA → ${USER}@${HOST}:${APP_DIR}"
          python3 - <<'PY' | ssh -i "$HOME/.ssh/id_deploy" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            "${USER}@${HOST}" \
            bash -s
          import os, shlex, pathlib, re, sys
          os.environ.setdefault("APP_DIR", "/home/stock/stock-analyzer")
          raw = (os.environ.get("VPS_DOMAIN") or "").strip().strip("\"'")
          raw = re.sub(r"^https?://", "", raw, flags=re.I)
          raw = raw.split("/")[0].strip()
          os.environ["VPS_DOMAIN"] = raw or "160.251.179.50.sslip.io"
          print(f"VPS_DOMAIN len={len(os.environ['VPS_DOMAIN'])}", file=sys.stderr)
          keys = [
              "APP_DIR",
              "VPS_DOMAIN",
              "JQUANTS_API_KEY",
              "BASIC_AUTH_USER",
              "BASIC_AUTH_PASSWORD",
              "CERTBOT_EMAIL",
              "MCP_TOKEN",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "SLACK_WEBHOOK_URL",
              "SLACK_WEBHOOK_URL_APP",
              "SLACK_WEBHOOK_URL_BATCH",
              "SLACK_WEBHOOK_URL_INFRA",
              "SLACK_WEBHOOK_URL_QUIET",
          ]
          print("set -euo pipefail")
          for k in keys:
              print(f"export {k}={shlex.quote(os.environ.get(k, ''))}")
          print(pathlib.Path("deploy/update.sh").read_text())
          PY

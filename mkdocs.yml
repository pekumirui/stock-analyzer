site_name: 株式分析ツール wiki
site_description: docs/ の設計と AGENTS.md の閲覧用（元ファイルの配置は動かさない）
docs_dir: .wiki-docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモード
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモード

plugins:
  - search:
      lang: ja

hooks:
  - tools/wiki/mkdocs_hook.py

extra_css:
  - assets/wiki.css

extra_javascript:
  - path: assets/mermaid-elk.js
    type: module

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # mermaid の図（docs/dataflow/ など）。material が mermaid.js を読み込んで描く
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# 絶対パス（/app など）とアンカー不足は元 md の書き方のまま。
# wiki 内の相対リンクは dest 上で付け替える。wiki 外（README / DESIGN.md / deploy など）
# への相対リンクはコピー側で外す。wiki 内の壊れたリンクは警告＝ --strict で失敗。
validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  anchors: ignore

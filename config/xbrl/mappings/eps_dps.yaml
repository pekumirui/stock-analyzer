    - { ns: jpigp_cor, name: BasicEarningsPerShareIFRS, priority: 20, standard: IFRS }
    - { ns: jpigp_cor, name: BasicEarningsLossPerShareIFRS, priority: 30, standard: IFRS }
    - { ns: jpcrp_cor, name: BasicEarningsLossPerShareIFRSSummaryOfBusinessResults, priority: 40, standard: IFRS }
    - { ns: jpcrp_cor, name: BasicEarningsLossPerShareUSGAAPSummaryOfBusinessResults, priority: 40 }

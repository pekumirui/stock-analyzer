- std_item: net_sales
  elements:
    - { ns: jpigp_cor, name: RevenueIFRS, priority: 10, standard: IFRS }
    - { ns: jpigp_cor, name: Revenue, priority: 20, standard: IFRS }
    - { ns: jpigp_cor, name: NetSalesIFRS, priority: 25, standard: IFRS }
    # 収益の分解注記等で定義がずれる例（82530）があるので RevenueIFRS より後置。
    - { ns: jpigp_cor, name: Revenue2IFRS, priority: 30, standard: IFRS }
    # 短信サマリー。要素名が IFRS を表す。filing の基準が空/JPGAAP でも使う（KAB-55）。
    - { ns: tse-ed-t, name: SalesIFRS, priority: 50 }
    - { ns: tse-ed-t, name: NetSalesIFRS, priority: 60 }
    - { ns: tse-ed-t, name: RevenueIFRS, priority: 70 }
    - { ns: tse-ed-t, name: OperatingRevenuesIFRS, priority: 80 }
- std_item: operating_income
  elements:
    - { ns: jpigp_cor, name: OperatingProfitLossIFRS, priority: 10, standard: IFRS }
    - { ns: jpigp_cor, name: OperatingIncome, priority: 20, standard: IFRS }
    - { ns: tse-ed-t, name: OperatingIncomeIFRS, priority: 50, standard: IFRS }
- std_item: profit_before_tax
  elements:
    - { ns: jpigp_cor, name: ProfitLossBeforeTaxIFRS, priority: 10, standard: IFRS }
- std_item: net_income
  elements:
    - { ns: jpigp_cor, name: ProfitLossAttributableToOwnersOfParentIFRS, priority: 10, standard: IFRS }
    # 単体 IFRS（436A0）。連結では attributable の方が先。
    - { ns: jpigp_cor, name: ProfitLossIFRS, priority: 15, standard: IFRS }
    - { ns: tse-ed-t, name: ProfitAttributableToOwnersOfParentIFRS, priority: 50, standard: IFRS }
- std_item: total_assets
  elements:
    - { ns: jpigp_cor, name: AssetsIFRS, priority: 10, standard: IFRS }
    - { ns: jpigp_cor, name: Assets, priority: 20, standard: IFRS }
- std_item: net_assets
  elements:
    - { ns: jpigp_cor, name: EquityIFRS, priority: 10, standard: IFRS }
- std_item: operating_cf
  elements:
    - { ns: jpigp_cor, name: NetCashProvidedByUsedInOperatingActivitiesIFRS, priority: 10, standard: IFRS }

- std_item: net_sales
  elements:
    - { ns: jpigp_cor, name: RevenueIFRS, priority: 10, standard: IFRS }
    - { ns: jpigp_cor, name: Revenue, priority: 20, standard: IFRS }
    - { ns: jpigp_cor, name: NetSalesIFRS, priority: 25, standard: IFRS }
    # 収益の分解注記等で定義がずれる例（82530）があるので RevenueIFRS より後置。
    - { ns: jpigp_cor, name: Revenue2IFRS, priority: 30, standard: IFRS }
    # 短信サマリー。要素名が IFRS を表す。filing の基準が空/JPGAAP でも使う（KAB-55）。
    - { ns: tse-ed-t, name: SalesIFRS, priority: 50 }
    - { ns: tse-ed-t, name: NetSalesIFRS, priority: 60 }
    - { ns: tse-ed-t, name: RevenueIFRS, priority: 70 }
    - { ns: tse-ed-t, name: OperatingRevenuesIFRS, priority: 80 }

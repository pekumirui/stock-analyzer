    - { ns: tse-ed-t, name: OperatingIncomeIFRS, priority: 50, standard: IFRS }
- std_item: profit_before_tax
  elements:
    - { ns: jpigp_cor, name: ProfitLossBeforeTaxIFRS, priority: 10, standard: IFRS }
- std_item: net_income
  elements:
    - { ns: jpigp_cor, name: ProfitLossAttributableToOwnersOfParentIFRS, priority: 10, standard: IFRS }
    # 単体 IFRS（436A0）。連結では attributable の方が先。
    - { ns: jpigp_cor, name: ProfitLossIFRS, priority: 15, standard: IFRS }
    - { ns: tse-ed-t, name: ProfitAttributableToOwnersOfParentIFRS, priority: 50, standard: IFRS }

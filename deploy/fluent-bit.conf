[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    HTTP_Server  Off
    storage.path /var/lib/fluent-bit

[INPUT]
    Name              tail
    Path              /var/log/app/stock-analyzer.log
    Tag               app
    DB                /var/lib/fluent-bit/app.db
    # copytruncate: same inode shrinks; tail resets the DB offset
    Skip_Long_Lines   On
    Exclude_Path      *.gz,*.1
    Mem_Buf_Limit     10MB
    multiline.parser  python

[INPUT]
    Name              tail
    Path              /var/log/app/*.log
    Tag               batch
    DB                /var/lib/fluent-bit/batch.db
    Path_Key          file
    # copytruncate: same inode shrinks; tail resets the DB offset
    # app/mcp logs have their own inputs; do not tail them twice
    Skip_Long_Lines   On
    Exclude_Path      /var/log/app/stock-analyzer.log,/var/log/app/mcp.log,/var/log/app/batch.log,*.gz,*.1
    Mem_Buf_Limit     10MB
    multiline.parser  python

[INPUT]
    Name              tail
    Path              /var/log/nginx/error.log
    Tag               nginx
    DB                /var/lib/fluent-bit/nginx.db
    Skip_Long_Lines   On
    Exclude_Path      *.gz,*.1
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Path              /var/log/app/mcp.log
    Tag               mcp
    DB                /var/lib/fluent-bit/mcp.db
    # copytruncate: same inode shrinks; tail resets the DB offset
    Skip_Long_Lines   On
    Exclude_Path      *.gz,*.1
    Mem_Buf_Limit     10MB
    multiline.parser  python

[INPUT]
    Name                 systemd
    Tag                  systemd
    Systemd_Filter       _SYSTEMD_UNIT=stock-analyzer.service
    Systemd_Filter       _SYSTEMD_UNIT=stock-analyzer-mcp.service
    Systemd_Filter_Type  Or
    Read_From_Tail       On
    DB                   /var/lib/fluent-bit/systemd.db

[FILTER]
    Name  modify
    Match app
    Add   source app

[FILTER]
    Name    lua
    Match   batch
    script  /etc/fluent-bit/slack.lua
    call    source_from_file

[FILTER]
    Name  modify
    Match nginx
    Add   source nginx

[FILTER]
    Name  modify
    Match mcp
    Add   source mcp

[FILTER]
    Name  modify
    Match systemd
    Add   source systemd

[FILTER]
    Name       grep
    Match      app
    Logical_Op or
    Regex      log ERROR: Exception in ASGI application
    Regex      log  5[0-9][0-9] 
    Regex      log ERROR: Error loading ASGI app
    Regex      log SchemaMismatch

[FILTER]
    Name       grep
    Match      batch
    Logical_Op or
    Regex      log ^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} fail cron 
    Regex      log failed=0*[1-9][0-9]*
    Regex      log errors=0*[1-9][0-9]*
    Regex      log リトライ上限
    Regex      log JQUANTS_API_KEY が未設定
    Regex      log list truncated
    Regex      log error missing-zip
    Regex      log failed doc_id=
    Regex      log normalize failed

[FILTER]
    Name       grep
    Match      nginx
    Logical_Op or
    Regex      log \[error\]
    Regex      log \[crit\]
    Regex      log \[emerg\]
    Regex      log \[alert\]

[FILTER]
    Name       grep
    Match      mcp
    Logical_Op or
    Regex      log ERROR
    Regex      log Traceback
    Regex      log MCP_TOKEN is unset

[FILTER]
    Name       grep
    Match      systemd
    Logical_Op or
    Regex      MESSAGE Failed with result
    Regex      MESSAGE Main process exited

[FILTER]
    Name    grep
    Match   *
    Exclude log hooks.slack.com
    Exclude log \?token=
    Exclude log JQUANTS_API_KEY=
    Exclude log MCP_TOKEN=
    Exclude log SLACK_WEBHOOK
    Exclude MESSAGE hooks.slack.com
    Exclude MESSAGE \?token=
    Exclude MESSAGE JQUANTS_API_KEY=
    Exclude MESSAGE MCP_TOKEN=
    Exclude MESSAGE SLACK_WEBHOOK

[FILTER]
    Name     throttle
    Match    *
    Rate     5
    Window   5
    Interval 1m

[FILTER]
    Name    lua
    Match   *
    script  /etc/fluent-bit/slack.lua
    call    format_slack

[OUTPUT]
    Name         http
    Match        app
    Host         hooks.slack.com
    Port         443
    URI          ${SLACK_WEBHOOK_URI_APP}
    tls          On
    tls.verify   On
    body_key     $body
    headers_key  $headers

[OUTPUT]
    Name         http
    Match        batch
    Host         hooks.slack.com
    Port         443
    URI          ${SLACK_WEBHOOK_URI_BATCH}
    tls          On
    tls.verify   On
    body_key     $body
    headers_key  $headers

[OUTPUT]
    Name         http
    Match        nginx
    Host         hooks.slack.com
    Port         443
    URI          ${SLACK_WEBHOOK_URI_INFRA}
    tls          On
    tls.verify   On
    body_key     $body
    headers_key  $headers

[OUTPUT]
    Name         http
    Match        mcp
    Host         hooks.slack.com
    Port         443
    URI          ${SLACK_WEBHOOK_URI_INFRA}
    tls          On
    tls.verify   On
    body_key     $body
    headers_key  $headers

[OUTPUT]
    Name         http
    Match        systemd
    Host         hooks.slack.com
    Port         443
    URI          ${SLACK_WEBHOOK_URI_INFRA}
    tls          On
    tls.verify   On
    body_key     $body
    headers_key  $headers

# Unclassified tags only. Match * would also fire for app/batch/nginx/mcp/systemd.
[OUTPUT]
    Name         http
    Match_Regex  ^(?!(app|batch|nginx|mcp|systemd)$).+$
    Host         hooks.slack.com
    Port         443
    URI          ${SLACK_WEBHOOK_URI}
    tls          On
    tls.verify   On
    body_key     $body
    headers_key  $headers

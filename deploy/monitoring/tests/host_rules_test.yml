# vmalert-tool unittest。tests/ops/test_monitoring.py から動かす（バイナリが無ければ skip）。
# 振る舞いだけを見る: 一瞬では鳴らない / 続けば鳴る / ディスクはすぐ / 戻れば消える。
rule_files:
  - ../rules/host.yml
evaluation_interval: 30s

tests:
  # CPU 1 コア。idle の増え方で使用率を作る（30 秒で 4.5 秒 idle = 85%）。
  - name: cpu warning only after it lasts
    interval: 30s
    input_series:
      - series: 'node_cpu_seconds_total{job="node",mode="idle",cpu="0"}'
        values: '0+4.5x40'
    alert_rule_test:
      - eval_time: 3m
        groupname: host-alerts
        alertname: HostCpuUsage
        exp_alerts: []
      - eval_time: 10m
        groupname: host-alerts
        alertname: HostCpuUsage
        exp_alerts:
          - exp_labels: {severity: warning, resource: cpu}
            exp_annotations:
              summary: CPU 使用率が 80% 以上で 5 分続いています
              value: 85.0%

  - name: cpu critical and recovery
    interval: 30s
    input_series:
      # 95% を 10 分 → 50% に戻す
      - series: 'node_cpu_seconds_total{job="node",mode="idle",cpu="0"}'
        values: '0+1.5x20 45+15x40'
    alert_rule_test:
      - eval_time: 9m
        groupname: host-alerts
        alertname: HostCpuUsage
        exp_alerts:
          - exp_labels: {severity: warning, resource: cpu}
            exp_annotations:
              summary: CPU 使用率が 80% 以上で 5 分続いています
              value: 95.0%
          - exp_labels: {severity: critical, resource: cpu}
            exp_annotations:
              summary: CPU 使用率が 90% 以上で 5 分続いています
              value: 95.0%
      # 10 分で 50% に戻る。戻った直後はまだ解消にしない（値は最後に超えていたときのまま）
      - eval_time: 13m
        groupname: host-alerts
        alertname: HostCpuUsage
        exp_alerts:
          - exp_labels: {severity: warning, resource: cpu}
            exp_annotations:
              summary: CPU 使用率が 80% 以上で 5 分続いています
              value: 83.8%
          - exp_labels: {severity: critical, resource: cpu}
            exp_annotations:
              summary: CPU 使用率が 90% 以上で 5 分続いています
              value: 95.0%
      - eval_time: 25m
        groupname: host-alerts
        alertname: HostCpuUsage
        exp_alerts: []

  - name: short memory spike does not alert
    interval: 30s
    input_series:
      # 95% を 3 分だけ
      - series: 'node_memory_MemTotal_bytes{job="node"}'
        values: '100x40'
      - series: 'node_memory_MemAvailable_bytes{job="node"}'
        values: '50x10 5x6 50x24'
    alert_rule_test:
      - eval_time: 8m
        groupname: host-alerts
        alertname: HostMemoryUsage
        exp_alerts: []
      - eval_time: 18m
        groupname: host-alerts
        alertname: HostMemoryUsage
        exp_alerts: []

  - name: disk alerts at once
    interval: 30s
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",mountpoint="/",fstype="ext4",device="/dev/vda1"}'
        values: '100x10'
      - series: 'node_filesystem_free_bytes{job="node",mountpoint="/",fstype="ext4",device="/dev/vda1"}'
        values: '50 50 15 15 15 5 5 5 50 50 50'
      - series: 'node_filesystem_avail_bytes{job="node",mountpoint="/",fstype="ext4",device="/dev/vda1"}'
        values: '50 50 15 15 15 5 5 5 50 50 50'
    alert_rule_test:
      - eval_time: 30s
        groupname: host-alerts
        alertname: HostDiskUsage
        exp_alerts: []
      - eval_time: 1m
        groupname: host-alerts
        alertname: HostDiskUsage
        exp_alerts:
          - exp_labels: {severity: warning, resource: disk, mountpoint: /, fstype: ext4, device: /dev/vda1, job: node}
            exp_annotations:
              summary: ディスク / の使用率が 80% 以上です
              value: 85.0%
      - eval_time: 3m
        groupname: host-alerts
        alertname: HostDiskUsage
        exp_alerts:
          - exp_labels: {severity: warning, resource: disk, mountpoint: /, fstype: ext4, device: /dev/vda1, job: node}
            exp_annotations:
              summary: ディスク / の使用率が 80% 以上です
              value: 95.0%
          - exp_labels: {severity: critical, resource: disk, mountpoint: /, fstype: ext4, device: /dev/vda1, job: node}
            exp_annotations:
              summary: ディスク / の使用率が 90% 以上です
              value: 95.0%
      - eval_time: 4m30s
        groupname: host-alerts
        alertname: HostDiskUsage
        exp_alerts: []

  - name: scrape target down
    interval: 30s
    input_series:
      - series: 'up{job="node",instance="127.0.0.1:9100"}'
        values: '1 1 0x20'
    alert_rule_test:
      - eval_time: 2m
        groupname: monitoring-self
        alertname: MetricsTargetDown
        exp_alerts: []
      - eval_time: 8m
        groupname: monitoring-self
        alertname: MetricsTargetDown
        exp_alerts:
          - exp_labels: {severity: warning, resource: monitoring, job: node, instance: "127.0.0.1:9100"}
            exp_annotations:
              summary: node のメトリクスが 5 分取れていません
              value: down

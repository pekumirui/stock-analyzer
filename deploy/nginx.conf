# このファイルは見本。実体は deploy/provision.sh が
# /etc/nginx/sites-available/stock-analyzer に冪等生成する。
# 証明書があれば 80→443 リダイレクト、無ければ 80 でプロキシ。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 160.251.179.50.sslip.io _;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 160.251.179.50.sslip.io _;

    ssl_certificate /etc/letsencrypt/live/160.251.179.50.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/160.251.179.50.sslip.io/privkey.pem;

    auth_basic "stock-analyzer";
    auth_basic_user_file /etc/nginx/stock-analyzer.htpasswd;
    client_max_body_size 1m;

    location = / {
        auth_basic off;
        return 301 /monthly;
    }
    location ^~ /monthly {
        auth_basic off;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /sitemap.xml {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }
    location ^~ /static/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/v1/tables {
        auth_basic off;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/api/v1/tables/[0-9][0-9A-Z]{3}[0-9](?:/[0-9]{4})?$ {
        auth_basic off;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location ^~ /app {
        auth_basic "stock-analyzer";
        auth_basic_user_file /etc/nginx/stock-analyzer.htpasswd;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/oauth- {
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/openid-configuration {
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /oauth/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
    }

    location ~ ^/mcp/?$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

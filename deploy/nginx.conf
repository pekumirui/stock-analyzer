# /etc/nginx/sites-available/stock-analyzer
# ドメインが無い間は server_name を _ にし、certbot は後回し。

server {
    listen 80;
    server_name example.com;

    # sudo htpasswd -c /etc/nginx/stock-analyzer.htpasswd YOUR_USER
    auth_basic "stock-analyzer";
    auth_basic_user_file /etc/nginx/stock-analyzer.htpasswd;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
